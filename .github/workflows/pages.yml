
name: Deploy to production environment

on:
  workflow_call:
    inputs:
      install:
        type: string
        required: false
        default: pnpm install --frozen-lockfile
      build:
        type: string
        required: false
        default: pnpm run build
      output_dir:
        type: string
        required: false
        default: dist/
      node_version:
        type: number
        required: false
        default: 22

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "${{ inputs.node_version }}"
          cache: pnpm

      - name: Install dependencies
        run: ${{ inputs.install }}

      - name: Build
        run: ${{ inputs.build }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.output_dir }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
